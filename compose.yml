# log-guy with a small SolrCloud: one ZooKeeper and two Solr nodes. Agents run in the stacks of the applications.
# Run "mvn clean install" first, the image is built from log-guy-server/target. Then "docker compose up -d", after
# changes "docker compose up -d --build". Data and configuration are in ./docker-data, the containers start as root
# and fix the owner of their directories there. The first start creates docker-data/etc/application.yml and prints
# the admin password and the agent token: docker compose logs log-guy-init
name: log-guy

services:
  zookeeper:
    image: zookeeper:3.9.4
    restart: unless-stopped
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: mntr,conf,ruok
    volumes:
      - ./docker-data/zookeeper/data:/data
      - ./docker-data/zookeeper/datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 5s
      retries: 20

  solr1:
    image: solr:9.10.1
    restart: unless-stopped
    # starts as root, hands /var/solr to solr and runs Solr as solr
    user: root
    entrypoint: &solr-entrypoint
      - sh
      - -c
      - find /var/solr \! -user solr -exec chown solr:solr '{}' + && exec gosu solr docker-entrypoint.sh solr-foreground
    environment: &solr-env
      ZK_HOST: zookeeper:2181
      SOLR_HEAP: 1g
    ports:
      # admin UI, only on localhost
      - "127.0.0.1:${SOLR_PORT:-28983}:8983"
    volumes:
      - ./docker-data/solr1:/var/solr
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck: &solr-health
      test: ["CMD", "curl", "-sf", "http://localhost:8983/solr/admin/info/system?wt=json"]
      interval: 5s
      retries: 30

  solr2:
    image: solr:9.10.1
    restart: unless-stopped
    user: root
    entrypoint: *solr-entrypoint
    environment: *solr-env
    volumes:
      - ./docker-data/solr2:/var/solr
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck: *solr-health

  # Creates application.yml if missing, uploads the configset, creates logs_v1 and the alias logs.
  # Skips what exists, so it runs on every start.
  log-guy-init:
    image: log-guy-server:compose
    build: log-guy-server
    entrypoint: ["/log-guy-init.sh"]
    environment:
      <<: &log-guy-env
        LOG_GUY_SOLR_URLS: http://solr1:8983/solr,http://solr2:8983/solr
        LOG_GUY_SOLR_REPLICATIONFACTOR: "2"
      # password of the admin user on the first start, random if empty
      LOG_GUY_ADMIN_PASSWORD: ${LOG_GUY_ADMIN_PASSWORD:-}
    volumes:
      - ./docker/log-guy-init.sh:/log-guy-init.sh:ro
      - ./docker-data/etc:/etc/log-guy
    depends_on:
      solr1:
        condition: service_healthy
      solr2:
        condition: service_healthy

  log-guy:
    image: log-guy-server:compose
    build: log-guy-server
    restart: unless-stopped
    environment:
      <<: *log-guy-env
      JAVA_OPTS: -Xmx1g
      FIX_FILE_SYSTEM_RIGHTS: "true"
    ports:
      - "${LOG_GUY_PORT:-28080}:8080"
    volumes:
      # writable, the GUI saves scripts to scripts/
      - ./docker-data/etc:/etc/log-guy
      - ./docker-data/log-guy:/var/lib/log-guy
    depends_on:
      log-guy-init:
        condition: service_completed_successfully
