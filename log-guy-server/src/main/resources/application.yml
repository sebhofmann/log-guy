# Defaults of log-guy. Overridden by /etc/log-guy/application.yml.
spring:
  application:
    name: log-guy
  main:
    banner-mode: off
  autoconfigure:
    # users come from log-guy.users, never a generated default user
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  shell:
    interactive:
      enabled: false
  threads:
    virtual:
      enabled: true
  mvc:
    static-path-pattern: /static/**
    async:
      # the hits of an archive search are streamed until the job ends, at most log-guy.archive.search.max-runtime
      request-timeout: 11m
  ai:
    mcp:
      server:
        name: log-guy
        protocol: STREAMABLE
        type: SYNC
        # the tools are defined by log-guy itself, with their own schema and pseudonymization
        tool-callback-converter: false
        annotation-scanner:
          enabled: false

gg:
  jte:
    use-precompiled-templates: true


server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,loggers

log-guy:
  data-dir: /var/lib/log-guy
  cli:
    server-url: http://localhost:${server.port}
  zone: Europe/Berlin
  apps: {}
  users: []
  tokens: []
  ingest:
    max-chunk-size: 8MB
    max-concurrent: 32
    retry-after: 2s
  hot:
    frame-size: 1MB
    frame-max-age: 60s
    flush-interval: 5s
    compression-level: 3
  archive:
    enabled: true
    threads: 2
    poll-interval: 5s
    compression-level: 9
    # a file leaves hot/ when its last event is older than this, the index window of an application may not be longer
    hot-days: 7
    # written instead of a line whose lifecycle filter failed, the original stays in hot/ for archive refilter
    placeholder: "[log-guy: Zeile zurückgehalten, Filter {filter} fehlgeschlagen, Offset {offset}]"
    field-placeholder: "[log-guy: Event zurückgehalten, Filter {filter} fehlgeschlagen]"
    search:
      threads: 4
      max-jobs: 2
      default-range: 1d
      max-range: 92d
      max-hits: 10000
      max-runtime: 10m
      context-lines: 0
      max-context-lines: 20
      max-line-length: 4000
      keep: 1h
  scripts:
    dir: /etc/log-guy/scripts
    event-timeout: 50ms
    max-size: 256KB
    test-lines: 20000
    test-events: 500
  solr:
    urls:
      - http://localhost:8983/solr
    user: ""
    configset: log-guy-v1
    collection: logs_v1
    alias: logs
    replication-factor: 2
    timeout: 60s
  indexer:
    enabled: true
    threads: 4
    poll-interval: 1s
    batch-size: 1000
    read-size: 1MB
    round-size: 64MB
    provisional-after: 5s
    max-event-size: 1MB
    index-days: 7
    stats-interval: 10s
  search:
    default-range: 24h
    default-rows: 100
    max-rows: 1000
    max-bars: 300
    split-limit: 8
    facet-limit: 10
    max-facet-limit: 100
    context-lines: 20
    max-context-lines: 500
    context-bytes: 512KB
  retention:
    # every night at 02:30 in the zone of log-guy, "-" switches the cleanup off
    cron: "0 30 2 * * *"
    expunge-deletes: true
  reindex:
    # events loaded from the archive into the index are deleted again after this time
    expires-after: 24h
    # deletes loaded events whose time is over, every hour, "-" switches it off
    expire-cron: "0 15 * * * *"
    max-range: 92d
    keep-jobs: 20
  alerts:
    enabled: true
    # events older than this are not checked, e.g. when backfilling or indexing again
    max-age: 1h
    default-cooldown: 15m
    tick-interval: 2s
    keep: 30d
    max-text: 500
    test-range: 24h
    test-max-events: 2000000
    test-samples: 100
    # below spring.mvc.async.request-timeout, the GUI reconnects
    stream-duration: 10m
    stream-ping: 15s
  mcp:
    path: /mcp
    session-idle-timeout: 2h
    max-sessions: 100
    max-events: 50
    max-text: 2000
  server-log:
    ring-size: 5000
    keep-days: 30
    pattern: "%d{ISO8601} %-5p [%t] %c{1}: %m%n%ex"
